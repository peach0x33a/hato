name: Nightly Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  nightly:
    name: Build & Publish Nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd web --frozen-lockfile

      - name: Pack nightly release
        run: bash scripts/pack-release.sh nightly

      - name: Update nightly tag & publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin nightly

          NOTES=$(printf '%s\n' \
            "Rolling nightly build from \`main\` (${SHORT_SHA})." \
            "" \
            "- **Commit**: \`${GITHUB_SHA}\` (${COMMIT_MSG})" \
            "- **Built at**: ${BUILD_TIME}" \
            "" \
            "### 一键安装 Nightly" \
            "\`\`\`bash" \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash -s -- --nightly" \
            "# 中国大陆镜像源：" \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash -s -- --nightly --cn" \
            "\`\`\`")

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Hato Nightly (${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
            gh release upload nightly \
              release/hato-nightly.tar.gz \
              release/SHA256SUMS \
              --clobber
          else
            gh release create nightly \
              release/hato-nightly.tar.gz \
              release/SHA256SUMS \
              --title "Hato Nightly (${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
          fi
